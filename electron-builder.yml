appId: ru.nsstms.review-assistent
productName: Review Assistent
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/sherpa-onnx-*/**
extraResources:
  - from: resources
    to: resources
    filter: ['**/*']
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Native modules (sherpa-onnx, ffmpeg) are installed for the build machine: build each OS and arch on itself.
mac:
  target: dmg
  category: public.app-category.productivity
  # Ad-hoc signature: runs locally, macOS asks for the permissions again after every rebuild.
  # For distribution put 'Developer ID Application: …' here and enable notarization.
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Распознавание вашей речи во время созвона.
    NSAudioCaptureUsageDescription: Распознавание речи собеседников — системный звук созвона.
linux:
  target: AppImage
  category: Office
